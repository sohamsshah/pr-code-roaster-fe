name: PR Impact Area

on:
  workflow_dispatch:
    inputs:
      pr_url:
        description: "GitHub PR URL to analyze (e.g. https://github.com/org/repo/pull/123)"
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Parse PR URL
        id: parse
        run: |
          PR_URL="${{ inputs.pr_url }}"
          # Extract owner/repo/number from URL like https://github.com/org/repo/pull/123
          OWNER=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+)/([^/]+)/pull/([0-9]+)|\1|')
          REPO=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+)/([^/]+)/pull/([0-9]+)|\2|')
          PR_NUMBER=$(echo "$PR_URL" | sed -E 's|https://github.com/([^/]+)/([^/]+)/pull/([0-9]+)|\3|')
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "repo=$REPO" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "Analyzing PR #$PR_NUMBER in $OWNER/$REPO"

      - name: Fetch PR diff via GitHub API
        id: fetch_diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER="${{ steps.parse.outputs.owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          PR_NUMBER="${{ steps.parse.outputs.pr_number }}"

          # Fetch PR metadata
          PR_JSON=$(gh api repos/$OWNER/$REPO/pulls/$PR_NUMBER)
          PR_TITLE=$(echo "$PR_JSON" | jq -r '.title')
          PR_AUTHOR=$(echo "$PR_JSON" | jq -r '.user.login')
          BASE_SHA=$(echo "$PR_JSON" | jq -r '.base.sha')
          HEAD_SHA=$(echo "$PR_JSON" | jq -r '.head.sha')

          echo "pr_title=$PR_TITLE" >> $GITHUB_OUTPUT
          echo "pr_author=$PR_AUTHOR" >> $GITHUB_OUTPUT
          echo "base_sha=$BASE_SHA" >> $GITHUB_OUTPUT
          echo "head_sha=$HEAD_SHA" >> $GITHUB_OUTPUT

          # Fetch changed files
          gh api repos/$OWNER/$REPO/pulls/$PR_NUMBER/files \
            --paginate \
            --jq '[.[] | {filename, status, additions, deletions, changes}]' \
            > changed_files.json

          echo "Changed files fetched: $(cat changed_files.json | jq length)"

      - name: Analyze impact areas
        id: analyze
        run: |
          OWNER="${{ steps.parse.outputs.owner }}"
          REPO="${{ steps.parse.outputs.repo }}"
          PR_NUMBER="${{ steps.parse.outputs.pr_number }}"
          PR_TITLE="${{ steps.fetch_diff.outputs.pr_title }}"
          PR_AUTHOR="${{ steps.fetch_diff.outputs.pr_author }}"

          python3 - <<'PYEOF'
          import json, re, os

          with open("changed_files.json") as f:
              files = json.load(f)

          # Infer impact areas from file paths
          impact_areas = set()
          area_rules = [
              (r"^\.github/", "CI/CD"),
              (r"^frontend/", "Frontend"),
              (r"^backend/apps/users/", "Authentication"),
              (r"^backend/apps/workflows/", "Workflows"),
              (r"^backend/config/", "Backend Config"),
              (r"^backend/", "Backend"),
              (r"^docker", "Infrastructure"),
              (r"\.(sql|migration)$", "Database"),
              (r"(test|spec)\.", "Tests"),
              (r"\.(md|txt|rst)$", "Documentation"),
          ]

          for f in files:
              fname = f["filename"]
              matched = False
              for pattern, area in area_rules:
                  if re.search(pattern, fname, re.IGNORECASE):
                      impact_areas.add(area)
                      matched = True
                      break
              if not matched:
                  impact_areas.add("Other")

          total_additions = sum(f["additions"] for f in files)
          total_deletions = sum(f["deletions"] for f in files)

          report = {
              "pr_url": os.environ.get("PR_URL", ""),
              "pr_number": int(os.environ.get("PR_NUMBER", "0")),
              "pr_title": os.environ.get("PR_TITLE", ""),
              "pr_author": os.environ.get("PR_AUTHOR", ""),
              "repository": f"{os.environ.get('OWNER', '')}/{os.environ.get('REPO', '')}",
              "impact_areas": sorted(impact_areas),
              "summary": {
                  "files_changed": len(files),
                  "additions": total_additions,
                  "deletions": total_deletions,
              },
              "changed_files": [f["filename"] for f in files],
          }

          with open("report.json", "w") as out:
              json.dump(report, out, indent=2)

          print(json.dumps(report, indent=2))
          PYEOF
        env:
          PR_URL: ${{ inputs.pr_url }}
          PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
          PR_TITLE: ${{ steps.fetch_diff.outputs.pr_title }}
          PR_AUTHOR: ${{ steps.fetch_diff.outputs.pr_author }}
          OWNER: ${{ steps.parse.outputs.owner }}
          REPO: ${{ steps.parse.outputs.repo }}

      - name: Upload impact report artifact
        uses: actions/upload-artifact@v4
        with:
          name: impact-report
          path: report.json
          retention-days: 7
